<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game1 - หุบเขาหินอัคนี</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffebee,#fff3e0);color:#321}
.container{max-width:900px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
h1{text-align:center;color:#c62828}.subtitle{text-align:center;color:#555}
.scorebox{display:flex;justify-content:space-between;font-weight:bold;margin:18px 0}
.items{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0}
.rock{padding:12px 18px;background:#ffe0b2;border:2px solid #ef6c00;border-radius:14px;cursor:grab;font-size:18px}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.zone{min-height:220px;border:3px dashed #999;border-radius:16px;padding:14px;background:#fafafa}
.zone h2{text-align:center;margin-top:0}
.zone.over{background:#fff8e1;border-color:#f57c00}
.placed{display:block;margin:8px 0;padding:10px;border-radius:10px;background:#eee}
.correct{background:#c8e6c9!important}
.wrong{background:#ffcdd2!important}
button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:12px;background:#d32f2f;color:white;font-size:20px;cursor:pointer}
.result{text-align:center}.result h2{font-size:36px;color:#ff9800}
@media(max-width:700px){.zones{grid-template-columns:1fr}.rock{width:100%;text-align:center}}
</style>
</head>
<body>
<div class="container">
<h1>🔴 หุบเขาหินอัคนี</h1>
<p class="subtitle">ลากชื่อหินไปวางให้ถูกประเภท</p>

<div class="scorebox">
<span>คะแนนเต็ม 25</span>
<span id="liveScore">คะแนน: 0</span>
</div>

<div id="items" class="items"></div>

<div class="zones">
<div class="zone" data-type="extrusive">
<h2>🌋 หินอัคนีพุ</h2>
<p>เกิดจากลาวาเย็นตัวบนผิวโลก</p>
</div>
<div class="zone" data-type="intrusive">
<h2>🪨 หินอัคนีแทรกซอน</h2>
<p>เกิดจากแมกมาเย็นตัวใต้ผิวโลก</p>
</div>
</div>

<button onclick="checkAnswer()">ตรวจคำตอบ</button>
</div>

<script>
const WEBAPP="https://script.google.com/macros/s/AKfycbwvFtdoQhD6QBjf5P7kZQybUfg_FynntsI4Ond_0PcCFNDq_7vJSeqCXu_i5lbm0njbjQ/exec";

const rocks=[
{name:"บะซอลต์",type:"extrusive"},
{name:"ไรโอไลต์",type:"extrusive"},
{name:"ออบซิเดียน",type:"extrusive"},
{name:"พัมมิซ",type:"extrusive"},
{name:"สคอเรีย",type:"extrusive"},
{name:"แกรนิต",type:"intrusive"},
{name:"ไดออไรต์",type:"intrusive"},
{name:"แกบโบร",type:"intrusive"},
{name:"เพริโดไทต์",type:"intrusive"},
{name:"ไซอีไนต์",type:"intrusive"}
];

let selected=rocks.sort(()=>Math.random()-0.5).slice(0,5);
let startTime=Date.now();

function renderItems(){
 const box=document.getElementById("items");
 selected.forEach((r,i)=>{
  const div=document.createElement("div");
  div.className="rock";
  div.draggable=true;
  div.textContent=r.name;
  div.dataset.type=r.type;
  div.dataset.name=r.name;
  div.id="rock"+i;
  div.addEventListener("dragstart",e=>e.dataTransfer.setData("id",div.id));
  box.appendChild(div);
 });
}

document.querySelectorAll(".zone").forEach(zone=>{
 zone.addEventListener("dragover",e=>{e.preventDefault();zone.classList.add("over")});
 zone.addEventListener("dragleave",()=>zone.classList.remove("over"));
 zone.addEventListener("drop",e=>{
  e.preventDefault();
  zone.classList.remove("over");
  const id=e.dataTransfer.getData("id");
  const item=document.getElementById(id);
  if(item){
   item.classList.add("placed");
   zone.appendChild(item);
  }
 });
});

function checkAnswer(){
 let correct=0;
 document.querySelectorAll(".rock").forEach(item=>{
  const parent=item.parentElement;
  if(parent.classList.contains("zone") && item.dataset.type===parent.dataset.type){
   correct++;
   item.classList.add("correct");
   item.classList.remove("wrong");
  }else{
   item.classList.add("wrong");
   item.classList.remove("correct");
  }
 });

 const score=correct*5;
 document.getElementById("liveScore").textContent="คะแนน: "+score;

 localStorage.setItem("score1",score);
 if(score>0)localStorage.setItem("crystal1","แดง");

 sendScore(score);
 showResult(score);
}

function sendScore(score){
 const total=
 Number(localStorage.getItem("pretestScore")||0)+
 Number(score)+
 Number(localStorage.getItem("score2")||0)+
 Number(localStorage.getItem("score3")||0)+
 Number(localStorage.getItem("score4")||0)+
 Number(localStorage.getItem("posttestScore")||0);

 const playtime=Math.round((Date.now()-startTime)/1000);

 fetch(WEBAPP,{method:"POST",body:JSON.stringify({
  name:localStorage.getItem("playerName")||"",
  classroom:localStorage.getItem("playerClass")||"",
  number:localStorage.getItem("playerNo")||"",
  stage:"Igneous",
  score:score,
  crystal:"แดง",
  total:total,
  playtime:String(playtime),
  device:navigator.userAgent
 })}).catch(()=>{});
}

function showResult(score){
 document.querySelector(".container").innerHTML=`
 <div class="result">
 <h1>🎉 พิชิตหุบเขาหินอัคนีสำเร็จ</h1>
 <h2>${score} / 25 คะแนน</h2>
 <p>💎 ได้รับผลึกสีแดง</p>
 <p>💎 บันทึกคะแนนเรียบร้อยแล้ว</p>
 <p>🏰 กรุณากลับสู่หน้าหลัก เพื่อทำภารกิจถัดไป</p>
 </div>`;
}

renderItems();
</script>
</body>
</html>
