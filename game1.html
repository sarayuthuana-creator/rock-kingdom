<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ด่าน 1 หุบเขาหินอัคนี V2</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffb199,#ff0844);padding:15px}
.wrap{max-width:1000px;margin:auto}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
h1{text-align:center;color:#c62828}
.progress{height:20px;background:#eee;border-radius:20px;overflow:hidden}
.bar{height:100%;width:0;background:#4caf50}
.score{text-align:center;font-size:22px;font-weight:bold}
.zones{display:flex;gap:15px;flex-wrap:wrap}
.zone{flex:1;min-width:250px;min-height:140px;border:3px dashed #777;border-radius:15px;padding:10px}
.items{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:15px}
.item{background:#ffe0b2;padding:12px 16px;border-radius:12px;cursor:move}
.correct{background:#c8e6c9!important}
.wrong{background:#ffcdd2!important}
button{padding:12px 20px;border:none;border-radius:12px;font-size:18px;cursor:pointer}
#result{display:none;text-align:center;margin-top:20px;padding:20px;border-radius:15px;background:#fff5f5}
.crystal{font-size:80px;color:red;animation:float 1s infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-10px)}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>🔴 หุบเขาหินอัคนี</h1>

<div id="player"></div>
<p>ลากหินไปยังประเภทที่ถูกต้อง (5 ข้อ ข้อละ 5 คะแนน)</p>

<div class="progress"><div class="bar" id="bar"></div></div>
<div class="score">คะแนน <span id="score">0</span>/25</div>

<div class="zones">
<div class="zone" id="extrusive" ondrop="drop(event)" ondragover="allowDrop(event)">🌋 หินอัคนีพุ</div>
<div class="zone" id="intrusive" ondrop="drop(event)" ondragover="allowDrop(event)">🏔️ หินอัคนีแทรกซอน</div>
</div>

<div class="items" id="items"></div>

<div style="text-align:center;margin-top:20px">
<button onclick="finishGame()">จบด่าน</button>
</div>

<div id="result">
<div class="crystal">🔴</div>
<h2>ภารกิจสำเร็จ!</h2>
<p>💎 ได้รับผลึกสีแดง</p>
<h3 id="finalScore"></h3>
<p id="detail"></p>
<h2 id="stars"></h2>
</div>

</div>
</div>

<script>
const rocks=[
{name:"หินบะซอลต์",type:"extrusive"},
{name:"หินออบซิเดียน",type:"extrusive"},
{name:"หินพัมมิซ",type:"extrusive"},
{name:"หินไรโอไลต์",type:"extrusive"},
{name:"หินแกรนิต",type:"intrusive"},
{name:"หินไดออไรต์",type:"intrusive"},
{name:"หินแกบโบร",type:"intrusive"},
{name:"หินเพอริโดไทต์",type:"intrusive"}
];

document.getElementById('player').innerHTML=
"👦 "+(localStorage.getItem('playerName')||'-')+
" | 🏫 "+(localStorage.getItem('playerClass')||'-')+
" | เลขที่ "+(localStorage.getItem('playerNo')||'-');

const selected=rocks.sort(()=>Math.random()-0.5).slice(0,5);
let score=0,correct=0,wrong=0,done=0;

selected.forEach((r,i)=>{
 const d=document.createElement('div');
 d.className='item';
 d.draggable=true;
 d.id='r'+i;
 d.dataset.type=r.type;
 d.innerText=r.name;
 d.ondragstart=e=>e.dataTransfer.setData('text',d.id);
 items.appendChild(d);
});

function allowDrop(e){e.preventDefault();}

function drop(e){
 e.preventDefault();
 const id=e.dataTransfer.getData('text');
 const el=document.getElementById(id);
 if(!el || el.dataset.done) return;

 if(el.dataset.type===e.currentTarget.id){
   score+=5; correct++;
   el.classList.add('correct');
 }else{
   wrong++;
   el.classList.add('wrong');
 }
 el.dataset.done=1;
 done++;

 document.getElementById('score').textContent=score;
 document.getElementById('bar').style.width=(done/5*100)+'%';
}

function finishGame(){
 if(done<5){alert('กรุณาตอบให้ครบ 5 ข้อ');return;}

 localStorage.setItem('score1',score);
 localStorage.setItem('crystal1','true');

 let stars='⭐';
 if(score>=25) stars='⭐⭐⭐⭐⭐';
 else if(score>=20) stars='⭐⭐⭐⭐';
 else if(score>=15) stars='⭐⭐⭐';
 else if(score>=10) stars='⭐⭐';

 document.getElementById('result').style.display='block';
 document.getElementById('finalScore').textContent='คะแนนรวม '+score+'/25';
 document.getElementById('detail').textContent=
 '✔ ตอบถูก '+correct+' ข้อ | ❌ ตอบผิด '+wrong+' ข้อ';
 document.getElementById('stars').textContent=stars;
}
</script>
</body>
</html>
