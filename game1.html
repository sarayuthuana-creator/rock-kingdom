<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game1 - หุบเขาหินอัคนี</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:'Prompt','Mali',sans-serif;min-height:100vh;color:#253247;background:linear-gradient(135deg,#ffebee,#fff3e0,#ffe0e0)}
.container{max-width:980px;margin:auto;background:rgba(255,255,255,.95);padding:26px;border-radius:28px;box-shadow:0 18px 45px rgba(0,0,0,.18);border:4px solid rgba(255,255,255,.75)}
h1,h2{font-family:'Mali','Prompt',sans-serif;text-align:center;text-shadow:2px 4px 0 rgba(0,0,0,.08)}
h1{color:#b71c1c}.subtitle{text-align:center;color:#5f6f89;font-weight:600}.scorebox{display:flex;justify-content:space-between;font-weight:700;margin:18px 0}
.questionCard{background:#fffdf8;border:3px solid #ffb74d;border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 6px 0 #ef6c00}.rockName{font-size:22px;font-weight:700;color:#bf360c;margin-bottom:12px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.optionBtn{padding:13px;border-radius:16px;border:3px solid #ffcc80;background:#fff8e1;font-size:17px;font-weight:700;cursor:pointer}.optionBtn.selected{background:#ffe0b2;border-color:#ef6c00;box-shadow:0 4px 0 #bf360c}.correct{background:#c8e6c9!important;border-color:#2e7d32!important;color:#1b5e20}.wrong{background:#ffcdd2!important;border-color:#c62828!important;color:#b71c1c}
.mainBtn{display:block;width:100%;padding:15px;margin-top:20px;border:0;border-radius:18px;background:linear-gradient(180deg,#ef5350,#c62828);color:white;font-size:20px;font-weight:700;box-shadow:0 6px 0 #8e0000;cursor:pointer}.result{text-align:center}.result h2{font-size:38px;color:#ff9800}.crystal{font-size:78px;margin:8px 0;animation:pulse 1.1s infinite alternate}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.14)}}.homeBtn{display:inline-block;margin-top:15px;padding:14px 24px;background:linear-gradient(180deg,#ff9800,#f57c00);color:white;text-decoration:none;border-radius:16px;font-size:18px;font-weight:bold;box-shadow:0 5px 0 #e65100;transition:0.2s}.homeBtn:hover{transform:translateY(-2px)}.homeBtn:active{transform:translateY(3px)}
@media(max-width:620px){body{padding:12px}.container{padding:18px;border-radius:22px}.scorebox{font-size:14px}.options{grid-template-columns:1fr}.rockName{font-size:20px}}
</style>
</head>
<body>
<div class="container">
<h1>🔴 หุบเขาหินอัคนี</h1>
<p class="subtitle">แตะเลือกประเภทของหินให้ถูกต้อง เพื่อรับ 🔴💎 ผลึกสีแดง</p>
<div class="scorebox"><span>คะแนนเต็ม 25</span><span id="answered">ตอบแล้ว: 0 / 5</span></div>
<div id="questions"></div>
<button class="mainBtn" onclick="checkAnswer()">✅ ตรวจคำตอบ</button>
</div>
<script>
const WEBAPP="https://script.google.com/macros/s/AKfycbwvFtdoQhD6QBjf5P7kZQybUfg_FynntsI4Ond_0PcCFNDq_7vJSeqCXu_i5lbm0njbjQ/exec";
const HOME_URL="https://krusarayut.my.canva.site/rockkingdom/-home";
const SCORE_KEY="score1";
checkAlreadyDone();
function checkAlreadyDone(){const oldScore=localStorage.getItem(SCORE_KEY);if(oldScore!==null){document.querySelector(".container").innerHTML=`<div class="result"><div class="crystal">✅</div><h1>ภารกิจนี้สำเร็จแล้ว</h1><h2>คะแนนเดิม: ${oldScore}</h2><p>คุณเคยทำภารกิจนี้เรียบร้อยแล้ว</p><p>ไม่จำเป็นต้องทำซ้ำอีกครั้ง</p><a href="${HOME_URL}" class="homeBtn">🏠 กลับสู่ศูนย์บัญชาการเกม</a></div>`;throw new Error("Mission already completed");}}
const rocks=[{name:"บะซอลต์",type:"extrusive"},{name:"ไรโอไลต์",type:"extrusive"},{name:"ออบซิเดียน",type:"extrusive"},{name:"พัมมิซ",type:"extrusive"},{name:"สคอเรีย",type:"extrusive"},{name:"แกรนิต",type:"intrusive"},{name:"ไดออไรต์",type:"intrusive"},{name:"แกบโบร",type:"intrusive"},{name:"เพริโดไทต์",type:"intrusive"},{name:"ไซอีไนต์",type:"intrusive"}];
let selected=rocks.sort(()=>Math.random()-0.5).slice(0,5),answers={},checked=false,startTime=Date.now();
function render(){const box=document.getElementById("questions");box.innerHTML="";selected.forEach((r,i)=>{const div=document.createElement("div");div.className="questionCard";div.innerHTML=`<div class="rockName">${i+1}. 🪨 ${r.name}</div><div class="options"><button class="optionBtn" data-index="${i}" data-value="extrusive">🌋 หินอัคนีพุ</button><button class="optionBtn" data-index="${i}" data-value="intrusive">🪨 หินอัคนีแทรกซอน</button></div>`;box.appendChild(div);});document.querySelectorAll(".optionBtn").forEach(btn=>{btn.onclick=()=>{if(checked)return;const index=btn.dataset.index;answers[index]=btn.dataset.value;document.querySelectorAll(`.optionBtn[data-index="${index}"]`).forEach(b=>b.classList.remove("selected"));btn.classList.add("selected");document.getElementById("answered").textContent=`ตอบแล้ว: ${Object.keys(answers).length} / 5`;};});}
function checkAnswer(){if(checked)return;if(Object.keys(answers).length<5){alert("กรุณาเลือกคำตอบให้ครบ 5 ข้อก่อนตรวจคำตอบ");return;}checked=true;let correct=0;selected.forEach((r,i)=>{const picked=answers[i];const buttons=document.querySelectorAll(`.optionBtn[data-index="${i}"]`);buttons.forEach(btn=>{if(btn.dataset.value===r.type)btn.classList.add("correct");if(btn.dataset.value===picked&&picked!==r.type)btn.classList.add("wrong");});if(picked===r.type)correct++;});const score=correct*5;setTimeout(()=>finishGame(score),1000);}
function finishGame(score){const playtime=Math.round((Date.now()-startTime)/1000);localStorage.setItem("score1",score);if(score>0)localStorage.setItem("crystal1","แดง");const total=Number(localStorage.getItem("pretestScore")||0)+Number(score)+Number(localStorage.getItem("score2")||0)+Number(localStorage.getItem("score3")||0)+Number(localStorage.getItem("score4")||0)+Number(localStorage.getItem("posttestScore")||0);fetch(WEBAPP,{method:"POST",body:JSON.stringify({name:localStorage.getItem("playerName")||"",classroom:localStorage.getItem("playerClass")||"",number:localStorage.getItem("playerNo")||"",stage:"Igneous",score:score,crystal:"แดง",total:total,playtime:String(playtime),device:navigator.userAgent})}).catch(()=>{});document.querySelector(".container").innerHTML=`<div class="result"><div class="crystal">🔴💎</div><h1>🎉 พิชิตหุบเขาหินอัคนีสำเร็จ</h1><h2>${score} / 25 คะแนน</h2><p>💎 ได้รับผลึกสีแดง</p><p>💎 บันทึกคะแนนเรียบร้อยแล้ว</p><p>🏰 กรุณากลับสู่ศูนย์บัญชาการเกม เพื่อทำภารกิจถัดไป</p><a href="${HOME_URL}" class="homeBtn">🏠 กลับสู่ศูนย์บัญชาการเกม</a></div>`;}
render();
</script>
</body>
</html>
