<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ด่าน 1 : หุบเขาหินอัคนี</title>
<style>
body{font-family:sans-serif;background:#fff4e6;margin:0;padding:20px;text-align:center}
.card{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.zone{display:inline-block;width:40%;min-height:120px;margin:10px;padding:10px;border:3px dashed #888;border-radius:12px;vertical-align:top}
.item{background:#ffe0b2;padding:10px;margin:8px;border-radius:10px;cursor:move}
button{padding:12px 20px;font-size:18px}
</style>
</head>
<body>
<div class="card">
<h1>🔴 ด่าน 1 : หุบเขาหินอัคนี</h1>
<p>ลากหินไปยังประเภทที่ถูกต้อง (5 ข้อ ข้อละ 5 คะแนน)</p>
<h2>คะแนน: <span id="score">0</span>/25</h2>

<div>
  <div class="zone" id="extrusive" ondrop="drop(event)" ondragover="allowDrop(event)">
    🌋 หินอัคนีพุ
  </div>
  <div class="zone" id="intrusive" ondrop="drop(event)" ondragover="allowDrop(event)">
    🏔️ หินอัคนีแทรกซอน
  </div>
</div>

<div id="items"></div>
<br>
<button onclick="finishGame()">จบด่าน</button>
<p id="msg"></p>
</div>

<script>
const rocks=[
{name:"หินบะซอลต์",type:"extrusive"},
{name:"หินออบซิเดียน",type:"extrusive"},
{name:"หินพัมมิซ",type:"extrusive"},
{name:"หินไรโอไลต์",type:"extrusive"},
{name:"หินแกรนิต",type:"intrusive"},
{name:"หินไดออไรต์",type:"intrusive"},
{name:"หินแกบโบร",type:"intrusive"},
{name:"หินเพอริโดไทต์",type:"intrusive"}
];

const selected=rocks.sort(()=>Math.random()-0.5).slice(0,5);
let score=0, answered=0;

const items=document.getElementById("items");
selected.forEach((r,i)=>{
 let d=document.createElement("div");
 d.className="item";
 d.draggable=true;
 d.id="rock"+i;
 d.dataset.type=r.type;
 d.innerText=r.name;
 d.ondragstart=e=>e.dataTransfer.setData("text",d.id);
 items.appendChild(d);
});

function allowDrop(ev){ev.preventDefault();}

function drop(ev){
 ev.preventDefault();
 const id=ev.dataTransfer.getData("text");
 const el=document.getElementById(id);
 if(!el || el.dataset.done) return;

 const correct = el.dataset.type===ev.currentTarget.id;
 if(correct){ score+=5; }
 answered++;
 el.dataset.done="1";
 el.style.opacity="0.5";
 document.getElementById("score").innerText=score;
}

function finishGame(){
 if(answered<5){
   alert("กรุณาลากให้ครบ 5 ข้อ");
   return;
 }
 localStorage.setItem("crystal1","true");
 localStorage.setItem("score1",score);
 document.getElementById("msg").innerHTML =
 "🎉 ผ่านด่าน! ได้รับ 💎 ผลึกสีแดง คะแนน "+score+"/25";
}
</script>
</body>
</html>
