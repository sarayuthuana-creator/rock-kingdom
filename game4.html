<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game4 - แผนภาพวัฏจักรหิน</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:'Prompt','Mali',sans-serif;min-height:100vh;background:linear-gradient(135deg,#e8f5e9,#e0f2f1,#f9fff9);color:#183326}.container{max-width:980px;margin:auto;background:rgba(255,255,255,.95);padding:26px;border-radius:28px;box-shadow:0 18px 45px rgba(0,0,0,.18);border:4px solid rgba(255,255,255,.75)}h1,h2{font-family:'Mali','Prompt',sans-serif;text-align:center;text-shadow:2px 4px 0 rgba(0,0,0,.08)}h1{color:#2e7d32}.subtitle{text-align:center;color:#4f6f58;font-weight:600}.scorebox{display:flex;justify-content:space-between;font-weight:700;margin:18px 0}.diagram{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:20px 0}.slot{background:#f7fff8;border:3px solid #a5d6a7;border-radius:20px;padding:14px;box-shadow:0 5px 0 #66bb6a}.slot label{display:block;font-weight:700;margin-bottom:8px;color:#1b5e20}select{width:100%;padding:13px;border-radius:14px;border:3px solid #81c784;font-family:'Prompt','Mali',sans-serif;font-size:16px;font-weight:700;background:white}.correct{background:#c8e6c9!important;border-color:#2e7d32!important}.wrong{background:#ffcdd2!important;border-color:#c62828!important}.centerNote{text-align:center;background:#f1f8e9;border-left:8px solid #43a047;border-radius:18px;padding:14px;margin:18px 0;font-weight:700}.mainBtn{display:block;width:100%;padding:15px;margin-top:20px;border:0;border-radius:18px;background:linear-gradient(180deg,#66bb6a,#2e7d32);color:white;font-size:20px;font-weight:700;box-shadow:0 6px 0 #1b5e20;cursor:pointer}.result{text-align:center}.result h2{font-size:38px;color:#ff9800}.crystal{font-size:78px;margin:8px 0;animation:pulse 1.1s infinite alternate}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.14)}}.homeBtn{display:inline-block;margin-top:15px;padding:14px 24px;background:linear-gradient(180deg,#ff9800,#f57c00);color:white;text-decoration:none;border-radius:16px;font-size:18px;font-weight:bold;box-shadow:0 5px 0 #e65100;transition:0.2s}@media(max-width:680px){body{padding:12px}.container{padding:18px;border-radius:22px}.diagram{grid-template-columns:1fr}.scorebox{font-size:14px}}
</style>
</head>
<body>
<div class="container"><h1>🟢 วงกตวัฏจักรหิน</h1><p class="subtitle">เลือกคำตอบให้ตรงกับลำดับในแผนภาพวัฏจักรหิน เพื่อรับ 🟢💎 ผลึกสีเขียว</p><div class="scorebox"><span>คะแนนเต็ม 25</span><span>เลือกให้ครบ 8 ช่อง</span></div><div class="centerNote">🔄 ลำดับวัฏจักรหิน: เริ่มจากแมกมา แล้ววนกลับสู่แมกมาอีกครั้ง</div><div id="diagram" class="diagram"></div><button class="mainBtn" onclick="checkAnswer()">✅ ตรวจคำตอบ</button></div>
<script>
const WEBAPP="https://script.google.com/macros/s/AKfycbwvFtdoQhD6QBjf5P7kZQybUfg_FynntsI4Ond_0PcCFNDq_7vJSeqCXu_i5lbm0njbjQ/exec";
const HOME_URL="https://krusarayut.my.canva.site/rockkingdom/-home";
const DONE_URL="https://krusarayut.my.canva.site/rockkingdom/page-9";
const SCORE_KEY="score4";checkAlreadyDone();
function checkAlreadyDone(){const oldScore=localStorage.getItem(SCORE_KEY);if(oldScore!==null){document.querySelector(".container").innerHTML=`<div class="result"><div class="crystal">✅</div><h1>ภารกิจนี้สำเร็จแล้ว</h1><h2>คะแนนเดิม: ${oldScore}</h2><p>คุณเคยทำภารกิจนี้เรียบร้อยแล้ว</p><p>ไม่จำเป็นต้องทำซ้ำอีกครั้ง</p><a href="${DONE_URL}" class="homeBtn">🎬 ดูคลิปภารกิจสำเร็จ</a></div>`;throw new Error("Mission already completed");}}
const answer=["แมกมา","หินอัคนี","ผุพังและกร่อน","ตะกอน","หินตะกอน","ความร้อนและความดัน","หินแปร","หลอมเหลว"];
const choices=[...answer];const emojiMap={"แมกมา":"🌋","หินอัคนี":"🔥🪨","ผุพังและกร่อน":"🌧️","ตะกอน":"🟫","หินตะกอน":"🔵🪨","ความร้อนและความดัน":"♨️","หินแปร":"✨🪨","หลอมเหลว":"🫠"};let checked=false,startTime=Date.now();
function render(){const box=document.getElementById("diagram");answer.forEach((ans,i)=>{const div=document.createElement("div");div.className="slot";div.dataset.answer=ans;div.innerHTML=`<label>${i+1}. ช่องที่ ${i+1}</label><select id="select${i}"><option value="">-- เลือกคำตอบ --</option>${choices.map(c=>`<option value="${c}">${emojiMap[c]} ${c}</option>`).join("")}</select>`;box.appendChild(div);});}
function checkAnswer(){if(checked)return;const slots=[...document.querySelectorAll(".slot")];const allFilled=slots.every((slot,i)=>document.getElementById("select"+i).value);if(!allFilled){alert("กรุณาเลือกคำตอบให้ครบ 8 ช่องก่อนตรวจคำตอบ");return;}checked=true;let correct=0;slots.forEach((slot,i)=>{const value=document.getElementById("select"+i).value;if(value===slot.dataset.answer){correct++;slot.classList.add("correct");}else{slot.classList.add("wrong");}});const score=Math.round((correct/8)*25);setTimeout(()=>finishGame(score),1000);}
function finishGame(score){const playtime=Math.round((Date.now()-startTime)/1000);localStorage.setItem("score4",score);if(score>0)localStorage.setItem("crystal4","เขียว");const total=Number(localStorage.getItem("pretestScore")||0)+Number(localStorage.getItem("score1")||0)+Number(localStorage.getItem("score2")||0)+Number(localStorage.getItem("score3")||0)+Number(score)+Number(localStorage.getItem("posttestScore")||0);fetch(WEBAPP,{method:"POST",body:JSON.stringify({name:localStorage.getItem("playerName")||"",classroom:localStorage.getItem("playerClass")||"",number:localStorage.getItem("playerNo")||"",stage:"RockCycle",score:score,crystal:"เขียว",total:total,playtime:String(playtime),device:navigator.userAgent})}).catch(()=>{});document.querySelector(".container").innerHTML=`<div class="result"><div class="crystal">🟢💎</div><h1>🎉 พิชิตวงกตวัฏจักรหินสำเร็จ</h1><h2>${score} / 25 คะแนน</h2><p>💎 ได้รับผลึกสีเขียว</p><p>💎 บันทึกคะแนนเรียบร้อยแล้ว</p><p>🎬 ไปชมคลิปภารกิจสำเร็จก่อนกลับศูนย์บัญชาการ</p><a href="${DONE_URL}" class="homeBtn">🎬 ดูคลิปภารกิจสำเร็จ</a></div>`;}
render();
</script>
</body>
</html>
