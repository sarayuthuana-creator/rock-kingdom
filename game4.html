<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game4 - วงกตวัฏจักรหิน</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  font-family:'Prompt','Mali',sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#e8f5e9,#e0f2f1,#f9fff9);
  color:#183326;
}
.container{
  max-width:980px;
  margin:auto;
  background:rgba(255,255,255,.96);
  padding:26px;
  border-radius:28px;
  box-shadow:0 18px 45px rgba(0,0,0,.18);
  border:4px solid rgba(255,255,255,.75);
}
h1,h2{
  font-family:'Mali','Prompt',sans-serif;
  text-align:center;
  text-shadow:2px 4px 0 rgba(0,0,0,.08);
}
h1{color:#2e7d32}
.subtitle{text-align:center;color:#4f6f58;font-weight:600}
.scorebox{
  display:flex;
  justify-content:space-between;
  font-weight:700;
  margin:18px 0;
}
.instruction{
  background:#f1f8e9;
  border-left:8px solid #43a047;
  border-radius:18px;
  padding:14px;
  margin:18px 0;
  font-weight:700;
  text-align:center;
}
.sequence{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin:18px 0;
}
.slot{
  min-height:92px;
  border:3px dashed #81c784;
  border-radius:20px;
  background:#f7fff8;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10px;
  font-weight:700;
  color:#607d62;
}
.slot.filled{
  border-style:solid;
  background:#e8f5e9;
  color:#1b5e20;
  box-shadow:0 5px 0 #66bb6a;
}
.slot.correct{background:#c8e6c9!important;border-color:#2e7d32!important;color:#1b5e20}
.slot.wrong{background:#ffcdd2!important;border-color:#c62828!important;color:#b71c1c}
.wordbank{
  margin-top:22px;
  background:#f7fff8;
  border:3px solid #a5d6a7;
  border-radius:24px;
  padding:16px;
}
.wordbank h2{margin:0 0 12px;color:#2e7d32}
.words{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.word{
  border:3px solid #81c784;
  border-radius:18px;
  background:linear-gradient(180deg,#ffffff,#effff0);
  padding:13px 8px;
  text-align:center;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 5px 0 #43a047;
  transition:.15s;
  user-select:none;
}
.word:hover{transform:translateY(-2px)}
.word.used{
  opacity:.35;
  pointer-events:none;
}
.wordEmoji{
  display:block;
  font-size:30px;
  margin-bottom:4px;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}
.mainBtn,.resetBtn{
  display:block;
  width:100%;
  padding:15px;
  border:0;
  border-radius:18px;
  color:white;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
}
.mainBtn{background:linear-gradient(180deg,#66bb6a,#2e7d32);box-shadow:0 6px 0 #1b5e20}
.resetBtn{background:linear-gradient(180deg,#90a4ae,#546e7a);box-shadow:0 6px 0 #37474f}
.result{text-align:center}
.result h2{font-size:38px;color:#ff9800}
.crystal{
  font-size:78px;
  margin:8px 0;
  animation:pulse 1.1s infinite alternate;
}
.homeBtn{
  display:inline-block;
  margin-top:15px;
  padding:14px 24px;
  background:linear-gradient(180deg,#ff9800,#f57c00);
  color:white;
  text-decoration:none;
  border-radius:16px;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 5px 0 #e65100;
  transition:0.2s;
}
.homeBtn:hover{transform:translateY(-2px)}
.homeBtn:active{transform:translateY(3px)}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.14)}}
@media(max-width:820px){
  .sequence{grid-template-columns:repeat(2,1fr)}
  .words{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
  body{padding:12px}
  .container{padding:18px;border-radius:22px}
  .scorebox{font-size:14px}
  .sequence{grid-template-columns:1fr}
  .words{grid-template-columns:1fr}
  .actions{grid-template-columns:1fr}
  .slot{min-height:78px}
}
</style>
</head>
<body>
<div class="container">
<h1>🟢 วงกตวัฏจักรหิน</h1>
<p class="subtitle">แตะเลือกการ์ด เพื่อเรียงลำดับวัฏจักรหินให้ถูกต้อง</p>

<div class="scorebox">
  <span>คะแนนเต็ม 25</span>
  <span id="progressText">เลือกแล้ว: 0 / 8</span>
</div>

<div class="instruction">
  📜 วิธีเล่น: แตะการ์ดคำตอบด้านล่าง ระบบจะนำไปใส่ในช่องลำดับอัตโนมัติ จากนั้นกดตรวจคำตอบ
</div>

<div id="sequence" class="sequence"></div>

<div class="wordbank">
  <h2>🧩 คลังคำตอบ</h2>
  <div id="words" class="words"></div>
</div>

<div class="actions">
  <button class="resetBtn" onclick="resetGame()">↩️ เริ่มเรียงใหม่</button>
  <button class="mainBtn" onclick="checkAnswer()">✅ ตรวจคำตอบ</button>
</div>
</div>

<script>
const WEBAPP="https://script.google.com/macros/s/AKfycbwvFtdoQhD6QBjf5P7kZQybUfg_FynntsI4Ond_0PcCFNDq_7vJSeqCXu_i5lbm0njbjQ/exec";
const HOME_URL="https://krusarayut.my.canva.site/rockkingdom/-home";
const DONE_URL="https://krusarayut.my.canva.site/rockkingdom/page-9";
const SCORE_KEY="score4";
const MISSION_NAME="วงกตวัฏจักรหิน";
checkAlreadyDone();

function checkAlreadyDone(){
  const oldScore=localStorage.getItem(SCORE_KEY);
  if(oldScore!==null){
    document.querySelector(".container").innerHTML=`
      <div class="result">
        <div class="crystal">✅</div>
        <h1>ภารกิจนี้สำเร็จแล้ว</h1>
        <h2>คะแนนเดิม: ${oldScore}</h2>
        <p>คุณเคยทำภารกิจนี้เรียบร้อยแล้ว</p>
        <p>ไม่จำเป็นต้องทำซ้ำอีกครั้ง</p>
        <a href="${DONE_URL}" class="homeBtn">🎬 ดูคลิปภารกิจสำเร็จ</a>
      </div>
    `;
    throw new Error("Mission already completed");
  }
}

const answer=[
  "แมกมา",
  "หินอัคนี",
  "ผุพังและกร่อน",
  "ตะกอน",
  "หินตะกอน",
  "ความร้อนและความดัน",
  "หินแปร",
  "หลอมเหลว"
];

const emojiMap={
  "แมกมา":"🌋",
  "หินอัคนี":"🔥🪨",
  "ผุพังและกร่อน":"🌧️",
  "ตะกอน":"🟫",
  "หินตะกอน":"🔵🪨",
  "ความร้อนและความดัน":"♨️",
  "หินแปร":"✨🪨",
  "หลอมเหลว":"🫠"
};

let chosen=[];
let checked=false;
let startTime=Date.now();

function shuffle(arr){
  return [...arr].sort(()=>Math.random()-0.5);
}

function renderSlots(){
  const seq=document.getElementById("sequence");
  seq.innerHTML="";
  for(let i=0;i<8;i++){
    const div=document.createElement("div");
    div.className="slot";
    div.id="slot"+i;
    div.innerHTML=`ช่องที่ ${i+1}`;
    seq.appendChild(div);
  }
}

function renderWords(){
  const box=document.getElementById("words");
  box.innerHTML="";
  shuffle(answer).forEach(word=>{
    const div=document.createElement("div");
    div.className="word";
    div.dataset.value=word;
    div.innerHTML=`<span class="wordEmoji">${emojiMap[word]}</span>${word}`;
    div.onclick=()=>chooseWord(div);
    box.appendChild(div);
  });
}

function chooseWord(card){
  if(checked)return;
  if(chosen.length>=8)return;
  const value=card.dataset.value;
  chosen.push(value);
  card.classList.add("used");
  updateSlots();
}

function updateSlots(){
  for(let i=0;i<8;i++){
    const slot=document.getElementById("slot"+i);
    if(chosen[i]){
      slot.classList.add("filled");
      slot.innerHTML=`<div><div style="font-size:28px">${emojiMap[chosen[i]]}</div><div>${i+1}. ${chosen[i]}</div></div>`;
    }else{
      slot.className="slot";
      slot.innerHTML=`ช่องที่ ${i+1}`;
    }
  }
  document.getElementById("progressText").textContent=`เลือกแล้ว: ${chosen.length} / 8`;
}

function resetGame(){
  if(checked)return;
  chosen=[];
  document.querySelectorAll(".word").forEach(w=>w.classList.remove("used"));
  updateSlots();
}

function checkAnswer(){
  if(checked)return;
  if(chosen.length<8){
    alert("กรุณาเลือกคำตอบให้ครบ 8 ขั้นตอนก่อนตรวจคำตอบ");
    return;
  }
  checked=true;
  let correct=0;
  chosen.forEach((value,i)=>{
    const slot=document.getElementById("slot"+i);
    if(value===answer[i]){
      correct++;
      slot.classList.add("correct");
    }else{
      slot.classList.add("wrong");
    }
  });

  let score=correct*3;
  if(correct===8)score=25;

  setTimeout(()=>finishGame(score),1200);
}

function finishGame(score){
  const playtime=Math.round((Date.now()-startTime)/1000);
  localStorage.setItem("score4",score);
  if(score>0)localStorage.setItem("crystal4","เขียว");

  const total=
    Number(localStorage.getItem("pretestScore")||0)+
    Number(localStorage.getItem("score1")||0)+
    Number(localStorage.getItem("score2")||0)+
    Number(localStorage.getItem("score3")||0)+
    Number(score)+
    Number(localStorage.getItem("posttestScore")||0);

  fetch(WEBAPP,{method:"POST",body:JSON.stringify({
    name:localStorage.getItem("playerName")||"",
    classroom:localStorage.getItem("playerClass")||"",
    number:localStorage.getItem("playerNo")||"",
    stage:"RockCycle",
    score:score,
    crystal:"เขียว",
    total:total,
    playtime:String(playtime),
    device:navigator.userAgent
  })}).catch(()=>{});

  document.querySelector(".container").innerHTML=`
  <div class="result">
    <div class="crystal">🟢💎</div>
    <h1>🎉 พิชิตวงกตวัฏจักรหินสำเร็จ</h1>
    <h2>${score} / 25 คะแนน</h2>
    <p>💎 ได้รับผลึกสีเขียว</p>
    <p>💎 บันทึกคะแนนเรียบร้อยแล้ว</p>
    <p>🎬 ไปชมคลิปภารกิจสำเร็จก่อนกลับศูนย์บัญชาการ</p>
    <a href="${DONE_URL}" class="homeBtn">🎬 ดูคลิปภารกิจสำเร็จ</a>
  </div>`;
}

renderSlots();
renderWords();
</script>
</body>
</html>
