<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pretest - ภารกิจกู้อาณาจักรหิน</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dff3ff,#f4fbff);color:#123}
.container{max-width:820px;margin:auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
h1{text-align:center;color:#1565c0}.subtitle{text-align:center;color:#555}
.progress{height:14px;background:#ddd;border-radius:20px;overflow:hidden;margin:18px 0 8px}
.bar{height:100%;width:0%;background:#4caf50;transition:.25s}
.status{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:18px}
.question{font-size:22px;font-weight:bold;margin:18px 0}
button{display:block;width:100%;padding:14px;margin:10px 0;border:0;border-radius:12px;background:#eef6ff;font-size:18px;cursor:pointer}
button:hover{background:#d7ecff}.correct{background:#4caf50!important;color:white}.wrong{background:#f44336!important;color:white}
.result{text-align:center}.result h2{font-size:36px;color:#ff9800}.small{color:#555}
</style>
</head>
<body>
<div class="container">
<h1>📚 แบบทดสอบก่อนเรียน</h1>
<p class="subtitle">ภารกิจกู้อาณาจักรหิน</p>
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="status"><span id="count">ข้อ 1 / 10</span><span id="scoreText">คะแนน: 0</span></div>
<div id="quiz"><div id="question" class="question"></div><div id="answers"></div></div>
</div>
<script>
const WEBAPP="https://script.google.com/macros/s/AKfycbwvFtdoQhD6QBjf5P7kZQybUfg_FynntsI4Ond_0PcCFNDq_7vJSeqCXu_i5lbm0njbjQ/exec";
const questions=[
{q:"หินอัคนีเกิดจากอะไร",a:["การสะสมตะกอน","การเย็นตัวของแมกมา","การแปรสภาพของหิน","การผุพังของหิน"],c:1},
{q:"หินชนิดใดเป็นหินอัคนีพุ",a:["แกรนิต","บะซอลต์","หินอ่อน","หินปูน"],c:1},
{q:"หินปูนเกิดจากอะไร",a:["ซากสิ่งมีชีวิตทะเล","แมกมา","ลาวา","ควอตซ์"],c:0},
{q:"หินทรายประกอบด้วยอะไรเป็นหลัก",a:["ดินเหนียว","กรวด","เม็ดทราย","แร่ไมกา"],c:2},
{q:"หินชนิดใดเป็นหินแปร",a:["หินปูน","หินอ่อน","หินทราย","หินบะซอลต์"],c:1},
{q:"หินชนวนแปรมาจากหินใด",a:["หินดินดาน","หินปูน","หินทราย","หินแกรนิต"],c:0},
{q:"กระบวนการใดทำให้เกิดหินแปร",a:["การเย็นตัว","การสะสมตัว","ความร้อนและความดัน","การละลาย"],c:2},
{q:"วัฏจักรหินเริ่มต้นจากอะไร",a:["หินตะกอน","แมกมา","หินแปร","หินทราย"],c:1},
{q:"ตะกอนเมื่ออัดแน่นจะกลายเป็นอะไร",a:["หินตะกอน","หินอ่อน","แมกมา","หินแปร"],c:0},
{q:"หินแปรเมื่อหลอมเหลวจะกลายเป็นอะไร",a:["ตะกอน","หินตะกอน","แมกมา","หินอัคนี"],c:2}
];
questions.sort(()=>Math.random()-0.5);
let current=0,score=0,startTime=Date.now();
function showQuestion(){
 if(current>=questions.length){finishQuiz();return;}
 const item=questions[current];
 document.getElementById("count").textContent=`ข้อ ${current+1} / 10`;
 document.getElementById("scoreText").textContent=`คะแนน: ${score}`;
 document.getElementById("bar").style.width=(current/questions.length*100)+"%";
 document.getElementById("question").textContent=item.q;
 const answers=document.getElementById("answers");
 answers.innerHTML="";
 item.a.forEach((choice,index)=>{
  const btn=document.createElement("button");
  btn.textContent=choice;
  btn.onclick=()=>{
   const all=document.querySelectorAll("button");
   all.forEach(b=>b.disabled=true);
   if(index===item.c){score++;btn.classList.add("correct");}
   else{btn.classList.add("wrong");all[item.c].classList.add("correct");}
   setTimeout(()=>{current++;showQuestion();},600);
  };
  answers.appendChild(btn);
 });
}
function finishQuiz(){
 const playtime=Math.round((Date.now()-startTime)/1000);
 localStorage.setItem("pretestScore",score);
 fetch(WEBAPP,{method:"POST",body:JSON.stringify({
  name:localStorage.getItem("playerName")||"",
  classroom:localStorage.getItem("playerClass")||"",
  number:localStorage.getItem("playerNo")||"",
  stage:"Pretest",score:score,crystal:"",total:score,playtime:String(playtime),device:navigator.userAgent
 })}).catch(()=>{});
 document.querySelector(".container").innerHTML=`
 <div class="result">
 <h1>🎉 ทำแบบทดสอบเสร็จแล้ว</h1>
 <h2>${score} / 10 คะแนน</h2>
 <p>💎 บันทึกคะแนนเรียบร้อยแล้ว</p>
 <p>🏰 กรุณากลับสู่หน้าหลัก เพื่อทำภารกิจถัดไป</p>
 <p class="small">Stage: Pretest</p>
 </div>`;
}
showQuestion();
</script>
</body>
</html>
