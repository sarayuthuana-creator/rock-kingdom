<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เริ่มภารกิจ - ภารกิจกู้อาณาจักรหิน</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  padding:20px;
  font-family:'Prompt','Mali',sans-serif;
  background:
    radial-gradient(circle at 15% 20%,rgba(120,144,156,.55) 0 8%,transparent 9%),
    radial-gradient(circle at 80% 15%,rgba(141,110,99,.45) 0 10%,transparent 11%),
    radial-gradient(circle at 20% 85%,rgba(96,125,139,.45) 0 12%,transparent 13%),
    radial-gradient(circle at 85% 78%,rgba(121,85,72,.40) 0 9%,transparent 10%),
    linear-gradient(135deg,#d7ccc8,#eceff1,#cfd8dc,#b0bec5);
  color:#233044;
  display:flex;
  align-items:center;
  justify-content:center;
}
.container{
  width:100%;
  max-width:720px;
  background:rgba(255,255,255,.96);
  border-radius:32px;
  padding:30px;
  box-shadow:0 22px 55px rgba(0,0,0,.25);
  border:5px solid rgba(255,255,255,.8);
  position:relative;
  overflow:hidden;
}
.container:before{
  content:"";
  position:absolute;
  width:240px;
  height:240px;
  right:-80px;
  top:-80px;
  background:radial-gradient(circle,#90a4ae,#546e7a);
  border-radius:42% 58% 53% 47%;
  opacity:.22;
}
.container:after{
  content:"";
  position:absolute;
  width:200px;
  height:200px;
  left:-70px;
  bottom:-70px;
  background:radial-gradient(circle,#bcaaa4,#6d4c41);
  border-radius:55% 45% 40% 60%;
  opacity:.22;
}
.content{position:relative;z-index:2}
.logo{
  font-size:86px;
  text-align:center;
  animation:float 1.8s infinite alternate;
}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-8px)}}
h1{
  font-family:'Mali','Prompt',sans-serif;
  text-align:center;
  color:#3e2723;
  font-size:34px;
  margin:5px 0 8px;
  text-shadow:2px 4px 0 rgba(0,0,0,.10);
}
.subtitle{
  text-align:center;
  color:#5d4037;
  font-weight:700;
  margin-bottom:22px;
  line-height:1.7;
  background:#fff8e1;
  border-radius:20px;
  padding:12px;
  border:3px solid #d7ccc8;
}
.form-card{
  background:linear-gradient(180deg,#ffffff,#f5f5f5);
  border-radius:26px;
  padding:22px;
  border:3px solid #bcaaa4;
  box-shadow:0 8px 0 #8d6e63;
}
label{
  display:block;
  font-weight:700;
  margin:14px 0 7px;
  color:#37474f;
}
input{
  width:100%;
  padding:15px;
  border:3px solid #cfd8dc;
  border-radius:18px;
  font-size:18px;
  font-family:'Prompt','Mali',sans-serif;
  outline:none;
  background:#fff;
}
input:focus{
  border-color:#795548;
  box-shadow:0 0 0 4px rgba(121,85,72,.18);
}
.start-btn{
  display:block;
  width:100%;
  margin-top:22px;
  padding:17px;
  border:0;
  border-radius:22px;
  background:linear-gradient(180deg,#8d6e63,#4e342e);
  color:white;
  font-size:22px;
  font-weight:700;
  font-family:'Mali','Prompt',sans-serif;
  cursor:pointer;
  box-shadow:0 8px 0 #3e2723;
  transition:.15s;
}
.start-btn:hover{transform:translateY(-2px)}
.start-btn:active{transform:translateY(4px);box-shadow:0 4px 0 #3e2723}
.done{
  display:none;
  text-align:center;
  margin-top:20px;
  background:#efebe9;
  border:3px solid #8d6e63;
  border-radius:22px;
  padding:18px;
  font-weight:700;
  color:#3e2723;
}
.done .big{font-size:46px}
@media(max-width:600px){
  body{padding:12px}
  .container{padding:20px;border-radius:24px}
  .logo{font-size:66px}
  h1{font-size:27px}
  input{font-size:16px}
  .start-btn{font-size:19px}
}

.homeBtn{
  display:inline-block;
  margin-top:15px;
  padding:14px 24px;
  background:linear-gradient(180deg,#ff9800,#f57c00);
  color:white;
  text-decoration:none;
  border-radius:16px;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 5px 0 #e65100;
  transition:0.2s;
}
.homeBtn:hover{transform:translateY(-2px)}
.homeBtn:active{transform:translateY(3px)}

</style>
</head>
<body>
<div class="container">
  <div class="content">
    <div class="logo">🪨💎</div>
    <h1>ภารกิจกู้อาณาจักรหิน</h1>
    <p class="subtitle">
      เกมเรียนรู้เรื่อง <b>หินและวัฏจักรหิน</b><br>
      ระดับชั้นประถมศึกษาปีที่ 6
    </p>

    <div class="form-card">
      <label for="name">👤 ชื่อ - สกุล</label>
      <input id="name" type="text" placeholder="เช่น เด็กชายศรายุธ ใจดี">

      <label for="classroom">🏫 ชั้น</label>
      <input id="classroom" type="text" placeholder="เช่น ป.6/1">

      <label for="number">🔢 เลขที่</label>
      <input id="number" type="number" placeholder="เช่น 12">

      <button class="start-btn" onclick="startGame()">🚀 เริ่มภารกิจ</button>
    </div>

    <div id="done" class="done">
      <div class="big">✅</div>
      <p>บันทึกข้อมูลผู้เล่นเรียบร้อยแล้ว</p>
      <p>กรุณาไปดูวิธีการเล่น ก่อนเริ่มภารกิจ</p>
      <a href="https://krusarayut.my.canva.site/rockkingdom/page-2" class="homeBtn">📜 ไปดูวิธีการเล่น</a>
    </div>
  </div>
</div>

<script>
function startGame(){
  const name=document.getElementById("name").value.trim();
  const classroom=document.getElementById("classroom").value.trim();
  const number=document.getElementById("number").value.trim();

  if(!name || !classroom || !number){
    alert("กรุณากรอกชื่อ ชั้น และเลขที่ให้ครบก่อนเริ่มภารกิจ");
    return;
  }

  localStorage.removeItem("pretestScore");
  localStorage.removeItem("score1");
  localStorage.removeItem("score2");
  localStorage.removeItem("score3");
  localStorage.removeItem("score4");
  localStorage.removeItem("posttestScore");
  localStorage.removeItem("totalScore");

  localStorage.removeItem("crystal1");
  localStorage.removeItem("crystal2");
  localStorage.removeItem("crystal3");
  localStorage.removeItem("crystal4");

  localStorage.setItem("playerName",name);
  localStorage.setItem("playerClass",classroom);
  localStorage.setItem("playerNo",number);

  document.getElementById("done").style.display="block";
  document.getElementById("done").scrollIntoView({behavior:"smooth"});
}
</script>
</body>
</html>
