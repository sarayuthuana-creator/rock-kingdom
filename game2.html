<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game2 - หุบเขาหินตะกอน</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{
  margin:0;padding:20px;font-family:'Prompt','Mali',sans-serif;min-height:100vh;
  background:linear-gradient(135deg,#e3f2fd,#e0f7fa,#f8fcff);color:#253247;
}
.container{
  max-width:960px;margin:auto;background:rgba(255,255,255,.95);padding:26px;border-radius:28px;
  box-shadow:0 18px 45px rgba(0,0,0,.18);border:4px solid rgba(255,255,255,.75);
}
h1,h2{font-family:'Mali','Prompt',sans-serif;text-align:center;text-shadow:2px 4px 0 rgba(0,0,0,.08)}
h1{color:#0277bd}.subtitle{text-align:center;color:#5f6f89;font-weight:600}
.scorebox{display:flex;justify-content:space-between;font-weight:700;margin:18px 0}
.gamearea{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
.panel{background:#f7fcff;border-radius:22px;padding:16px;border:3px dashed #90caf9}
.panel h2{margin-top:0;color:#01579b}
.card{
  padding:15px;margin:10px 0;border-radius:18px;background:linear-gradient(180deg,#ffffff,#eef9ff);
  border:3px solid #81d4fa;box-shadow:0 6px 0 #4fc3f7;cursor:pointer;font-size:18px;font-weight:700;text-align:center;transition:.15s;
}
.card:hover{transform:translateY(-2px)}.card.selected{background:#b3e5fc;border-color:#0288d1}
.card.paired{background:#e1f5fe;border-color:#039be5}
.card.correct{background:#c8e6c9;border-color:#43a047;box-shadow:0 6px 0 #2e7d32;color:#1b5e20}
.card.wrong{background:#ffcdd2;border-color:#e53935;box-shadow:0 6px 0 #b71c1c;color:#b71c1c}
.pairText{font-size:14px;color:#0277bd;margin-top:6px}
.mainBtn{
  display:block;width:100%;padding:15px;margin-top:20px;border:0;border-radius:18px;
  background:linear-gradient(180deg,#29b6f6,#0288d1);color:white;font-size:20px;font-weight:700;
  box-shadow:0 6px 0 #01579b;cursor:pointer;
}
.result{text-align:center}.result h2{font-size:38px;color:#ff9800}
.crystal{font-size:78px;margin:8px 0;animation:pulse 1.1s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.14)}}
@media(max-width:720px){body{padding:12px}.container{padding:18px;border-radius:22px}.gamearea{grid-template-columns:1fr}.scorebox{font-size:14px}}
</style>
</head>
<body>
<div class="container">
<h1>🔵 หุบเขาหินตะกอน</h1>
<p class="subtitle">เลือกชนิดหิน 1 ใบ แล้วเลือกลักษณะที่ตรงกัน จับคู่ให้ครบ 5 คู่ แล้วกดตรวจคำตอบ</p>
<div class="scorebox">
<span>คะแนนเต็ม 25</span>
<span id="pairCount">จับคู่แล้ว: 0 / 5</span>
</div>
<div class="gamearea">
<div class="panel"><h2>🪨 ชนิดหิน</h2><div id="left"></div></div>
<div class="panel"><h2>🔎 ลักษณะ</h2><div id="right"></div></div>
</div>
<button class="mainBtn" onclick="checkAnswer()">✅ ตรวจคำตอบ</button>
</div>

<script>
const WEBAPP="https://script.google.com/macros/s/AKfycbwvFtdoQhD6QBjf5P7kZQybUfg_FynntsI4Ond_0PcCFNDq_7vJSeqCXu_i5lbm0njbjQ/exec";
const bank=[
{rock:"หินทราย",desc:"ประกอบด้วยเม็ดทรายขนาดปานกลาง"},
{rock:"หินดินดาน",desc:"เนื้อละเอียด สีเข้ม แตกเป็นแผ่นบางได้"},
{rock:"หินปูน",desc:"เกิดจากซากสิ่งมีชีวิตทะเล"},
{rock:"หินคอนกลอมเมอเรต",desc:"ประกอบด้วยกรวดมน เนื้อหยาบ"},
{rock:"หินเชิร์ต",desc:"มีซิลิกาสูง เนื้อแน่นแข็ง"},
{rock:"หินโคลน",desc:"เกิดจากอนุภาคโคลนละเอียดมาก"},
{rock:"หินกรวดมน",desc:"มีเศษหินกลมมนปนอยู่มาก"},
{rock:"หินเบรกเซีย",desc:"มีเศษหินเหลี่ยมคมปนอยู่"},
{rock:"หินยิปซัม",desc:"เกิดจากการระเหยของน้ำในแอ่ง"},
{rock:"หินเกลือหิน",desc:"สะสมจากน้ำทะเลหรือน้ำเค็มระเหย"},
{rock:"ถ่านหิน",desc:"เกิดจากซากพืชทับถมกันนานมาก"},
{rock:"หินทรายแป้ง",desc:"ประกอบด้วยตะกอนขนาดเล็กกว่าเม็ดทราย"},
{rock:"หินโดโลไมต์",desc:"คล้ายหินปูนแต่มีแมกนีเซียมมาก"},
{rock:"หินมาร์ล",desc:"มีส่วนผสมของปูนและดินเหนียว"},
{rock:"หินดินเหนียว",desc:"เกิดจากตะกอนดินเหนียวละเอียด"}
];

let selected=bank.sort(()=>Math.random()-0.5).slice(0,5);
let leftItems=[...selected].sort(()=>Math.random()-0.5);
let rightItems=[...selected].sort(()=>Math.random()-0.5);
let selectedLeft=null, selectedRight=null;
let pairs={};
let startTime=Date.now();
let checked=false;

function render(){
 const left=document.getElementById("left"), right=document.getElementById("right");
 left.innerHTML=""; right.innerHTML="";
 leftItems.forEach((item,i)=>{
  const div=document.createElement("div");
  div.className="card"; div.textContent=item.rock; div.dataset.rock=item.rock; div.dataset.side="left";
  div.onclick=()=>selectLeft(div);
  left.appendChild(div);
 });
 rightItems.forEach((item,i)=>{
  const div=document.createElement("div");
  div.className="card"; div.innerHTML=item.desc; div.dataset.rock=item.rock; div.dataset.side="right";
  div.onclick=()=>selectRight(div);
  right.appendChild(div);
 });
}

function selectLeft(card){
 if(checked)return;
 selectedLeft=card;
 document.querySelectorAll("#left .card").forEach(c=>c.classList.remove("selected"));
 card.classList.add("selected");
 tryPair();
}

function selectRight(card){
 if(checked)return;
 selectedRight=card;
 document.querySelectorAll("#right .card").forEach(c=>c.classList.remove("selected"));
 card.classList.add("selected");
 tryPair();
}

function tryPair(){
 if(!selectedLeft || !selectedRight)return;

 const oldRightId=pairs[selectedLeft.dataset.rock];
 if(oldRightId){
  const oldRight=document.querySelector(`#right .card[data-pair-id="${oldRightId}"]`);
  if(oldRight){oldRight.classList.remove("paired"); oldRight.removeAttribute("data-pair-id");}
 }

 const pairId=selectedLeft.dataset.rock;
 pairs[selectedLeft.dataset.rock]=selectedRight.dataset.rock;

 selectedLeft.classList.add("paired");
 selectedRight.classList.add("paired");
 selectedRight.dataset.pairId=pairId;

 const currentPairs=Object.keys(pairs).length;
 document.getElementById("pairCount").textContent=`จับคู่แล้ว: ${currentPairs} / 5`;

 selectedLeft.classList.remove("selected");
 selectedRight.classList.remove("selected");
 selectedLeft=null; selectedRight=null;
}

function checkAnswer(){
 if(checked)return;
 if(Object.keys(pairs).length<5){
  alert("กรุณาจับคู่ให้ครบ 5 คู่ก่อนตรวจคำตอบ");
  return;
 }
 checked=true;
 let correct=0;

 document.querySelectorAll("#left .card").forEach(leftCard=>{
  const chosen=pairs[leftCard.dataset.rock];
  const rightCard=[...document.querySelectorAll("#right .card")].find(c=>c.dataset.pairId===leftCard.dataset.rock);
  if(chosen===leftCard.dataset.rock){
   correct++;
   leftCard.classList.add("correct");
   if(rightCard)rightCard.classList.add("correct");
  }else{
   leftCard.classList.add("wrong");
   if(rightCard)rightCard.classList.add("wrong");
  }
 });

 const score=correct*5;
 setTimeout(()=>finishGame(score),1200);
}

function finishGame(score){
 const playtime=Math.round((Date.now()-startTime)/1000);
 localStorage.setItem("score2",score);
 if(score>0)localStorage.setItem("crystal2","ฟ้า");

 const total=
 Number(localStorage.getItem("pretestScore")||0)+
 Number(localStorage.getItem("score1")||0)+
 Number(score)+
 Number(localStorage.getItem("score3")||0)+
 Number(localStorage.getItem("score4")||0)+
 Number(localStorage.getItem("posttestScore")||0);

 fetch(WEBAPP,{method:"POST",body:JSON.stringify({
  name:localStorage.getItem("playerName")||"",
  classroom:localStorage.getItem("playerClass")||"",
  number:localStorage.getItem("playerNo")||"",
  stage:"Sedimentary",
  score:score,
  crystal:"ฟ้า",
  total:total,
  playtime:String(playtime),
  device:navigator.userAgent
 })}).catch(()=>{});

 document.querySelector(".container").innerHTML=`
 <div class="result">
 <div class="crystal">🔵💎</div>
 <h1>🎉 พิชิตหุบเขาหินตะกอนสำเร็จ</h1>
 <h2>${score} / 25 คะแนน</h2>
 <p>💎 ได้รับผลึกสีฟ้า</p>
 <p>💎 บันทึกคะแนนเรียบร้อยแล้ว</p>
 <p>🏰 กรุณากลับสู่หน้าหลัก เพื่อทำภารกิจถัดไป</p>
 </div>`;
}

render();
</script>
</body>
</html>
