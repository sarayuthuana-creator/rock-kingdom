<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game2 - หุบเขาหินตะกอน</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  font-family:'Prompt','Mali',sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#e3f2fd,#e0f7fa,#f8fcff);
  color:#253247;
}
.container{
  max-width:960px;
  margin:auto;
  background:rgba(255,255,255,.95);
  padding:26px;
  border-radius:28px;
  box-shadow:0 18px 45px rgba(0,0,0,.18);
  border:4px solid rgba(255,255,255,.75);
}
h1,h2{
  font-family:'Mali','Prompt',sans-serif;
  text-align:center;
  text-shadow:2px 4px 0 rgba(0,0,0,.08);
}
h1{color:#0277bd}
.subtitle{text-align:center;color:#5f6f89;font-weight:600}
.scorebox{display:flex;justify-content:space-between;font-weight:700;margin:18px 0}
.gamearea{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:20px;
}
.card{
  padding:15px;
  margin:10px 0;
  border-radius:18px;
  background:linear-gradient(180deg,#ffffff,#eef9ff);
  border:3px solid #81d4fa;
  box-shadow:0 6px 0 #4fc3f7;
  cursor:pointer;
  font-size:18px;
  font-weight:700;
  text-align:center;
  transition:.15s;
}
.card:hover{transform:translateY(-2px)}
.card.selected{background:#b3e5fc;border-color:#0288d1}
.card.matched{background:#c8e6c9;border-color:#43a047;box-shadow:0 6px 0 #2e7d32;color:#1b5e20;cursor:default}
.card.wrong{background:#ffcdd2;border-color:#e53935;box-shadow:0 6px 0 #b71c1c}
.panel{
  background:#f7fcff;
  border-radius:22px;
  padding:16px;
  border:3px dashed #90caf9;
}
.panel h2{margin-top:0;color:#01579b}
.result{text-align:center}
.result h2{font-size:38px;color:#ff9800}
.crystal{
  font-size:78px;
  margin:8px 0;
  animation:pulse 1.1s infinite alternate;
}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.14)}}
@media(max-width:720px){
  body{padding:12px}
  .container{padding:18px;border-radius:22px}
  .gamearea{grid-template-columns:1fr}
  .scorebox{font-size:14px}
}
</style>
</head>
<body>
<div class="container">
<h1>🔵 หุบเขาหินตะกอน</h1>
<p class="subtitle">จับคู่ชนิดหินตะกอนกับลักษณะให้ถูกต้อง เพื่อรับ 🔵💎 ผลึกสีฟ้า</p>
<div class="scorebox">
<span>คะแนนเต็ม 25</span>
<span id="scoreText">จับคู่ถูก: 0 / 5</span>
</div>

<div class="gamearea">
<div class="panel">
<h2>🪨 ชนิดหิน</h2>
<div id="left"></div>
</div>
<div class="panel">
<h2>🔎 ลักษณะ</h2>
<div id="right"></div>
</div>
</div>
</div>

<script>
const WEBAPP="https://script.google.com/macros/s/AKfycbwvFtdoQhD6QBjf5P7kZQybUfg_FynntsI4Ond_0PcCFNDq_7vJSeqCXu_i5lbm0njbjQ/exec";

const bank=[
{rock:"หินทราย",desc:"ประกอบด้วยเม็ดทรายขนาดปานกลาง"},
{rock:"หินดินดาน",desc:"เนื้อละเอียด สีเข้ม แตกเป็นแผ่นบางได้"},
{rock:"หินปูน",desc:"เกิดจากซากสิ่งมีชีวิตทะเล"},
{rock:"หินคอนกลอมเมอเรต",desc:"ประกอบด้วยกรวดมน เนื้อหยาบ"},
{rock:"หินเชิร์ต",desc:"มีซิลิกาสูง เนื้อแน่นแข็ง"},
{rock:"หินโคลน",desc:"เกิดจากอนุภาคโคลนละเอียดมาก"},
{rock:"หินกรวดมน",desc:"มีเศษหินกลมมนปนอยู่มาก"},
{rock:"หินเบรกเซีย",desc:"มีเศษหินเหลี่ยมคมปนอยู่"},
{rock:"หินยิปซัม",desc:"เกิดจากการระเหยของน้ำในแอ่ง"},
{rock:"หินเกลือหิน",desc:"สะสมจากน้ำทะเลหรือน้ำเค็มระเหย"},
{rock:"ถ่านหิน",desc:"เกิดจากซากพืชทับถมกันนานมาก"},
{rock:"หินทรายแป้ง",desc:"ประกอบด้วยตะกอนขนาดเล็กกว่าเม็ดทราย"},
{rock:"หินโดโลไมต์",desc:"คล้ายหินปูนแต่มีแมกนีเซียมมาก"},
{rock:"หินมาร์ล",desc:"มีส่วนผสมของปูนและดินเหนียว"},
{rock:"หินดินเหนียว",desc:"เกิดจากตะกอนดินเหนียวละเอียด"}
];

let selected=bank.sort(()=>Math.random()-0.5).slice(0,5);
let leftItems=[...selected].sort(()=>Math.random()-0.5);
let rightItems=[...selected].sort(()=>Math.random()-0.5);
let selectedLeft=null;
let selectedRight=null;
let matched=0;
let startTime=Date.now();

function render(){
 const left=document.getElementById("left");
 const right=document.getElementById("right");
 left.innerHTML="";
 right.innerHTML="";

 leftItems.forEach((item,i)=>{
  const div=document.createElement("div");
  div.className="card";
  div.textContent=item.rock;
  div.dataset.rock=item.rock;
  div.onclick=()=>selectCard(div,"left");
  left.appendChild(div);
 });

 rightItems.forEach((item,i)=>{
  const div=document.createElement("div");
  div.className="card";
  div.textContent=item.desc;
  div.dataset.rock=item.rock;
  div.onclick=()=>selectCard(div,"right");
  right.appendChild(div);
 });
}

function selectCard(card,side){
 if(card.classList.contains("matched"))return;

 if(side==="left"){
  document.querySelectorAll("#left .card").forEach(c=>c.classList.remove("selected"));
  selectedLeft=card;
 }else{
  document.querySelectorAll("#right .card").forEach(c=>c.classList.remove("selected"));
  selectedRight=card;
 }
 card.classList.add("selected");

 if(selectedLeft&&selectedRight)checkMatch();
}

function checkMatch(){
 if(selectedLeft.dataset.rock===selectedRight.dataset.rock){
  selectedLeft.classList.add("matched");
  selectedRight.classList.add("matched");
  selectedLeft.classList.remove("selected");
  selectedRight.classList.remove("selected");
  matched++;
  document.getElementById("scoreText").textContent=`จับคู่ถูก: ${matched} / 5`;

  selectedLeft=null;
  selectedRight=null;

  if(matched===5){
   setTimeout(finishGame,600);
  }
 }else{
  selectedLeft.classList.add("wrong");
  selectedRight.classList.add("wrong");
  setTimeout(()=>{
   selectedLeft.classList.remove("wrong","selected");
   selectedRight.classList.remove("wrong","selected");
   selectedLeft=null;
   selectedRight=null;
  },650);
 }
}

function finishGame(){
 const score=matched*5;
 const playtime=Math.round((Date.now()-startTime)/1000);

 localStorage.setItem("score2",score);
 localStorage.setItem("crystal2","ฟ้า");

 const total=
 Number(localStorage.getItem("pretestScore")||0)+
 Number(localStorage.getItem("score1")||0)+
 Number(score)+
 Number(localStorage.getItem("score3")||0)+
 Number(localStorage.getItem("score4")||0)+
 Number(localStorage.getItem("posttestScore")||0);

 fetch(WEBAPP,{method:"POST",body:JSON.stringify({
  name:localStorage.getItem("playerName")||"",
  classroom:localStorage.getItem("playerClass")||"",
  number:localStorage.getItem("playerNo")||"",
  stage:"Sedimentary",
  score:score,
  crystal:"ฟ้า",
  total:total,
  playtime:String(playtime),
  device:navigator.userAgent
 })}).catch(()=>{});

 document.querySelector(".container").innerHTML=`
 <div class="result">
 <div class="crystal">🔵💎</div>
 <h1>🎉 พิชิตหุบเขาหินตะกอนสำเร็จ</h1>
 <h2>${score} / 25 คะแนน</h2>
 <p>💎 ได้รับผลึกสีฟ้า</p>
 <p>💎 บันทึกคะแนนเรียบร้อยแล้ว</p>
 <p>🏰 กรุณากลับสู่หน้าหลัก เพื่อทำภารกิจถัดไป</p>
 </div>`;
}

render();
</script>
</body>
</html>
