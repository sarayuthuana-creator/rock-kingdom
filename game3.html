<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game3 - หุบเขาหินแปร</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{
  margin:0;padding:20px;font-family:'Prompt','Mali',sans-serif;min-height:100vh;
  background:linear-gradient(135deg,#f3e5f5,#ede7f6,#fff8ff);color:#2f2340;
}
.container{
  max-width:980px;margin:auto;background:rgba(255,255,255,.95);padding:26px;border-radius:28px;
  box-shadow:0 18px 45px rgba(0,0,0,.18);border:4px solid rgba(255,255,255,.75);
}
h1,h2{font-family:'Mali','Prompt',sans-serif;text-align:center;text-shadow:2px 4px 0 rgba(0,0,0,.08)}
h1{color:#6a1b9a}.subtitle{text-align:center;color:#6d5f7d;font-weight:600}
.scorebox{display:flex;justify-content:space-between;font-weight:700;margin:18px 0}
.board{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:120px;margin-top:20px}
.panel{background:#fbf5ff;border-radius:22px;padding:16px;border:3px dashed #ce93d8;z-index:2}
.panel h2{margin-top:0;color:#6a1b9a}
.card{
  padding:15px;margin:12px 0;border-radius:18px;background:linear-gradient(180deg,#ffffff,#f3e5f5);
  border:3px solid #ba68c8;box-shadow:0 6px 0 #8e24aa;cursor:pointer;font-size:18px;font-weight:700;text-align:center;transition:.15s;
}
.card:hover{transform:translateY(-2px)}.card.selected{background:#e1bee7;border-color:#6a1b9a}
.card.paired{background:#f3e5f5;border-color:#8e24aa}
.card.correct{background:#c8e6c9;border-color:#43a047;box-shadow:0 6px 0 #2e7d32;color:#1b5e20}
.card.wrong{background:#ffcdd2;border-color:#e53935;box-shadow:0 6px 0 #b71c1c;color:#b71c1c}
svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
line{stroke:#7b1fa2;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
line.correctLine{stroke:#2e7d32} line.wrongLine{stroke:#c62828}
.mainBtn{
  display:block;width:100%;padding:15px;margin-top:22px;border:0;border-radius:18px;
  background:linear-gradient(180deg,#ab47bc,#6a1b9a);color:white;font-size:20px;font-weight:700;
  box-shadow:0 6px 0 #4a0072;cursor:pointer;
}
.result{text-align:center}.result h2{font-size:38px;color:#ff9800}
.crystal{font-size:78px;margin:8px 0;animation:pulse 1.1s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.14)}}
@media(max-width:760px){
  body{padding:12px}.container{padding:18px;border-radius:22px}
  .board{grid-template-columns:1fr;gap:18px}
  svg{display:none}
  .scorebox{font-size:14px}
}

.homeBtn{
  display:inline-block;
  margin-top:15px;
  padding:14px 24px;
  background:linear-gradient(180deg,#ff9800,#f57c00);
  color:white;
  text-decoration:none;
  border-radius:16px;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 5px 0 #e65100;
  transition:0.2s;
}
.homeBtn:hover{transform:translateY(-2px)}
.homeBtn:active{transform:translateY(3px)}

</style>
</head>
<body>
<div class="container">
<h1>🟣 หุบเขาหินแปร</h1>
<p class="subtitle">ขีดเส้นจับคู่ “หินเดิม” กับ “หินแปร” ให้ถูกต้อง แล้วกดตรวจคำตอบ เพื่อรับ 🟣💎 ผลึกสีม่วง</p>
<div class="scorebox">
<span>คะแนนเต็ม 25</span>
<span id="pairCount">จับคู่แล้ว: 0 / 5</span>
</div>

<div class="board" id="board">
<svg id="lines"></svg>
<div class="panel"><h2>🪨 หินเดิม</h2><div id="left"></div></div>
<div class="panel"><h2>✨ หินแปร</h2><div id="right"></div></div>
</div>

<button class="mainBtn" onclick="checkAnswer()">✅ ตรวจคำตอบ</button>
</div>

<script>
const WEBAPP="https://script.google.com/macros/s/AKfycbwvFtdoQhD6QBjf5P7kZQybUfg_FynntsI4Ond_0PcCFNDq_7vJSeqCXu_i5lbm0njbjQ/exec";
const HOME_URL="https://krusarayut.my.canva.site/rockkingdom/-home";
const DONE_URL="https://krusarayut.my.canva.site/rockkingdom/-home";
const DONE_LABEL="🏠 กลับสู่ศูนย์บัญชาการเกม";
const SCORE_KEY="score3";
const MISSION_NAME="หุบเขาหินแปร";
checkAlreadyDone();

function checkAlreadyDone(){
  const oldScore=localStorage.getItem(SCORE_KEY);
  if(oldScore!==null){
    document.querySelector(".container").innerHTML=`
      <div class="result">
        <div class="crystal">✅</div>
        <h1>ภารกิจนี้สำเร็จแล้ว</h1>
        <h2>คะแนนเดิม: ${oldScore}</h2>
        <p>คุณเคยทำภารกิจนี้เรียบร้อยแล้ว</p>
        <p>ไม่จำเป็นต้องทำซ้ำอีกครั้ง</p>
        <a href="${DONE_URL}" class="homeBtn">${DONE_LABEL}</a>
      </div>
    `;
    throw new Error("Mission already completed");
  }
}


const bank=[
{old:"หินปูน",meta:"หินอ่อน"},
{old:"หินดินดาน",meta:"หินชนวน"},
{old:"หินทราย",meta:"หินควอร์ตไซต์"},
{old:"หินแกรนิต",meta:"หินไนส์"},
{old:"หินบะซอลต์",meta:"แอมฟิโบไลต์"},
{old:"หินดินดานเนื้อละเอียด",meta:"หินฟิลไลต์"},
{old:"หินชีสต์เดิม",meta:"หินไนส์"},
{old:"ถ่านหิน",meta:"แกรไฟต์"},
{old:"หินเพอริโดไทต์",meta:"เซอร์เพนทิไนต์"},
{old:"หินโคลน",meta:"หินชนวน"}
];

let selected=bank.sort(()=>Math.random()-0.5).slice(0,5);
let leftItems=[...selected].sort(()=>Math.random()-0.5);
let rightItems=[...selected].sort(()=>Math.random()-0.5);
let selectedLeft=null, selectedRight=null;
let pairs={};
let checked=false;
let startTime=Date.now();

function render(){
 const left=document.getElementById("left");
 const right=document.getElementById("right");
 left.innerHTML=""; right.innerHTML="";

 leftItems.forEach((item,i)=>{
  const div=document.createElement("div");
  div.className="card";
  div.textContent=item.old;
  div.dataset.old=item.old;
  div.dataset.meta=item.meta;
  div.id="left"+i;
  div.onclick=()=>selectLeft(div);
  left.appendChild(div);
 });

 rightItems.forEach((item,i)=>{
  const div=document.createElement("div");
  div.className="card";
  div.textContent=item.meta;
  div.dataset.meta=item.meta;
  div.id="right"+i;
  div.onclick=()=>selectRight(div);
  right.appendChild(div);
 });
}

function selectLeft(card){
 if(checked)return;
 selectedLeft=card;
 document.querySelectorAll("#left .card").forEach(c=>c.classList.remove("selected"));
 card.classList.add("selected");
 tryPair();
}

function selectRight(card){
 if(checked)return;
 selectedRight=card;
 document.querySelectorAll("#right .card").forEach(c=>c.classList.remove("selected"));
 card.classList.add("selected");
 tryPair();
}

function tryPair(){
 if(!selectedLeft || !selectedRight)return;

 const leftId=selectedLeft.id;
 const rightId=selectedRight.id;

 for(const key in pairs){
  if(pairs[key]===rightId) delete pairs[key];
 }
 pairs[leftId]=rightId;

 document.querySelectorAll(".card").forEach(c=>c.classList.remove("paired","selected"));
 Object.keys(pairs).forEach(lid=>{
  const l=document.getElementById(lid);
  const r=document.getElementById(pairs[lid]);
  if(l)l.classList.add("paired");
  if(r)r.classList.add("paired");
 });

 document.getElementById("pairCount").textContent=`จับคู่แล้ว: ${Object.keys(pairs).length} / 5`;
 selectedLeft=null; selectedRight=null;
 drawLines();
}

function drawLines(){
 const svg=document.getElementById("lines");
 const board=document.getElementById("board").getBoundingClientRect();
 svg.innerHTML="";
 Object.keys(pairs).forEach(lid=>{
  const left=document.getElementById(lid);
  const right=document.getElementById(pairs[lid]);
  if(!left || !right)return;
  const a=left.getBoundingClientRect();
  const b=right.getBoundingClientRect();

  const x1=a.right-board.left;
  const y1=a.top+a.height/2-board.top;
  const x2=b.left-board.left;
  const y2=b.top+b.height/2-board.top;

  const line=document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("x1",x1);
  line.setAttribute("y1",y1);
  line.setAttribute("x2",x2);
  line.setAttribute("y2",y2);
  line.dataset.left=lid;
  svg.appendChild(line);
 });
}

window.addEventListener("resize",drawLines);

function checkAnswer(){
 if(checked)return;
 if(Object.keys(pairs).length<5){
  alert("กรุณาจับคู่ให้ครบ 5 คู่ก่อนตรวจคำตอบ");
  return;
 }
 checked=true;
 let correct=0;

 Object.keys(pairs).forEach(lid=>{
  const left=document.getElementById(lid);
  const right=document.getElementById(pairs[lid]);
  const line=[...document.querySelectorAll("line")].find(x=>x.dataset.left===lid);

  if(left.dataset.meta===right.dataset.meta){
   correct++;
   left.classList.add("correct");
   right.classList.add("correct");
   if(line)line.classList.add("correctLine");
  }else{
   left.classList.add("wrong");
   right.classList.add("wrong");
   if(line)line.classList.add("wrongLine");
  }
 });

 const score=correct*5;
 setTimeout(()=>finishGame(score),1400);
}

function finishGame(score){
 const playtime=Math.round((Date.now()-startTime)/1000);
 localStorage.setItem("score3",score);
 if(score>0)localStorage.setItem("crystal3","ม่วง");

 const total=
 Number(localStorage.getItem("pretestScore")||0)+
 Number(localStorage.getItem("score1")||0)+
 Number(localStorage.getItem("score2")||0)+
 Number(score)+
 Number(localStorage.getItem("score4")||0)+
 Number(localStorage.getItem("posttestScore")||0);

 fetch(WEBAPP,{method:"POST",body:JSON.stringify({
  name:localStorage.getItem("playerName")||"",
  classroom:localStorage.getItem("playerClass")||"",
  number:localStorage.getItem("playerNo")||"",
  stage:"Metamorphic",
  score:score,
  crystal:"ม่วง",
  total:total,
  playtime:String(playtime),
  device:navigator.userAgent
 })}).catch(()=>{});

 document.querySelector(".container").innerHTML=`
 <div class="result">
 <div class="crystal">🟣💎</div>
 <h1>🎉 พิชิตหุบเขาหินแปรสำเร็จ</h1>
 <h2>${score} / 25 คะแนน</h2>
 <p>💎 ได้รับผลึกสีม่วง</p>
 <p>💎 บันทึกคะแนนเรียบร้อยแล้ว</p>
 <p>🏰 กรุณากลับสู่ศูนย์บัญชาการเกม เพื่อทำภารกิจถัดไป</p>\n <a href="https://krusarayut.my.canva.site/rockkingdom/-home" class="homeBtn">🏠 กลับสู่ศูนย์บัญชาการเกม</a>
 </div>`;
}

render();
setTimeout(drawLines,200);
</script>
</body>
</html>
